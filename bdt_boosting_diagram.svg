<svg xmlns="http://www.w3.org/2000/svg" width="960" height="465" viewBox="0 0 960 465">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 z" fill="#3f4a56"/>
    </marker>
    <style>
      .title { font: 700 23px sans-serif; fill: #24303b; }
      .heading { font: 700 18px sans-serif; fill: #24303b; }
      .label { font: 16px sans-serif; fill: #24303b; }
      .small { font: 14px sans-serif; fill: #44515c; }
      .branch { stroke: #3f4a56; stroke-width: 2.2; fill: none; }
      .arrow { stroke: #3f4a56; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .root { fill: #f4a261; stroke: #b96b32; stroke-width: 1.8; }
      .split { fill: #2a9d8f; stroke: #177267; stroke-width: 1.8; }
      .leaf { fill: #49a9e8; stroke: #2378ad; stroke-width: 1.8; }
      .prediction { fill: #e6d5f7; stroke: #8064a2; stroke-width: 1.8; }
      .final { fill: #dff1d8; stroke: #588157; stroke-width: 2; }
    </style>
  </defs>

  <text x="480" y="30" text-anchor="middle" class="title">A boosted decision tree combines the predictions of many trees</text>

  <!-- Tree 1 -->
  <text x="180" y="68" text-anchor="middle" class="heading">Decision tree 1</text>
  <ellipse cx="180" cy="101" rx="69" ry="25" class="root"/>
  <text x="180" y="107" text-anchor="middle" class="label">first split</text>
  <path d="M180 126 L125 158 M180 126 L235 158" class="branch"/>
  <circle cx="125" cy="165" r="15" class="split"/><circle cx="235" cy="165" r="15" class="split"/>
  <path d="M117 178 L88 210 M133 178 L151 210 M227 178 L209 210 M243 178 L272 210" class="branch"/>
  <circle cx="82" cy="218" r="13" class="leaf"/><circle cx="157" cy="218" r="13" class="leaf"/>
  <circle cx="203" cy="218" r="13" class="leaf"/><circle cx="278" cy="218" r="13" class="leaf"/>
  <path d="M180 244 V281" class="arrow"/>
  <rect x="95" y="291" width="170" height="65" rx="11" class="prediction"/>
  <text x="180" y="318" text-anchor="middle" class="label">Prediction 1</text>
  <text x="180" y="341" text-anchor="middle" class="small">weight × tree output</text>

  <!-- Tree 2 -->
  <text x="480" y="68" text-anchor="middle" class="heading">Decision tree 2</text>
  <ellipse cx="480" cy="101" rx="69" ry="25" class="root"/>
  <text x="480" y="107" text-anchor="middle" class="label">next split</text>
  <path d="M480 126 V155" class="branch"/>
  <circle cx="480" cy="165" r="15" class="split"/>
  <path d="M470 177 L437 210 M490 177 L523 210" class="branch"/>
  <circle cx="430" cy="218" r="13" class="leaf"/><circle cx="530" cy="218" r="13" class="leaf"/>
  <path d="M480 244 V281" class="arrow"/>
  <rect x="395" y="291" width="170" height="65" rx="11" class="prediction"/>
  <text x="480" y="318" text-anchor="middle" class="label">Prediction 2</text>
  <text x="480" y="341" text-anchor="middle" class="small">weight × tree output</text>

  <!-- Ellipsis and final tree -->
  <text x="655" y="166" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#44515c">…</text>
  <text x="790" y="68" text-anchor="middle" class="heading">Decision tree N</text>
  <ellipse cx="790" cy="101" rx="69" ry="25" class="root"/>
  <text x="790" y="107" text-anchor="middle" class="label">later split</text>
  <path d="M790 126 L735 158 M790 126 V150 M790 126 L845 158" class="branch"/>
  <circle cx="735" cy="165" r="15" class="split"/><circle cx="790" cy="165" r="15" class="split"/><circle cx="845" cy="165" r="15" class="split"/>
  <path d="M727 178 L707 210 M743 178 L755 210 M790 180 V205 M837 178 L825 210 M853 178 L873 210" class="branch"/>
  <circle cx="701" cy="218" r="13" class="leaf"/><circle cx="761" cy="218" r="13" class="leaf"/>
  <circle cx="790" cy="218" r="13" class="leaf"/><circle cx="819" cy="218" r="13" class="leaf"/><circle cx="879" cy="218" r="13" class="leaf"/>
  <path d="M790 244 V281" class="arrow"/>
  <rect x="705" y="291" width="170" height="65" rx="11" class="prediction"/>
  <text x="790" y="318" text-anchor="middle" class="label">Prediction N</text>
  <text x="790" y="341" text-anchor="middle" class="small">weight × tree output</text>

  <!-- Weighted predictions combine -->
  <path d="M180 356 L390 394 M480 356 V382 M790 356 L570 394" class="branch"/>
  <rect x="375" y="382" width="210" height="72" rx="12" class="final"/>
  <text x="480" y="411" text-anchor="middle" class="heading">Final BDT score</text>
  <text x="480" y="437" text-anchor="middle" class="small">0 = prompt-like, 1 = signal-like</text>
</svg>
